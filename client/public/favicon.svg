<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="layer1-top" x1="24" y1="16" x2="104" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="layer1-side" x1="24" y1="40" x2="104" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="layer2-top" x1="24" y1="40" x2="104" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="layer2-side" x1="24" y1="64" x2="104" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="layer3-top" x1="24" y1="64" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="layer3-side" x1="24" y1="88" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Bottom Layer (Layer 3) -->
  <g filter="url(#glow)">
    <!-- Bottom Sides -->
    <path d="M24 76 L64 96 L64 104 L24 84 Z" fill="url(#layer3-side)" fill-opacity="0.8" />
    <path d="M64 96 L104 76 L104 84 L64 104 Z" fill="url(#layer3-side)" fill-opacity="0.95" />
    <!-- Bottom Top Surface -->
    <path d="M64 56 L104 76 L64 96 L24 76 Z" fill="url(#layer3-top)" fill-opacity="0.85" stroke="#5eead4" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Middle Layer (Layer 2) -->
  <g filter="url(#glow)">
    <!-- Middle Sides -->
    <path d="M24 52 L64 72 L64 80 L24 60 Z" fill="url(#layer2-side)" fill-opacity="0.8" />
    <path d="M64 72 L104 52 L104 60 L64 80 Z" fill="url(#layer2-side)" fill-opacity="0.95" />
    <!-- Middle Top Surface -->
    <path d="M64 32 L104 52 L64 72 L24 52 Z" fill="url(#layer2-top)" fill-opacity="0.85" stroke="#e879f9" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Top Layer (Layer 1) -->
  <g filter="url(#glow)">
    <!-- Top Sides -->
    <path d="M24 28 L64 48 L64 56 L24 36 Z" fill="url(#layer1-side)" fill-opacity="0.85" />
    <path d="M64 48 L104 28 L104 36 L64 56 Z" fill="url(#layer1-side)" fill-opacity="1" />
    <!-- Top Surface -->
    <path d="M64 8 L104 28 L64 48 L24 28 Z" fill="url(#layer1-top)" fill-opacity="0.9" stroke="#7dd3fc" stroke-width="2" stroke-linejoin="round" />
    <!-- Inner Core Highlight -->
    <path d="M64 16 L90 29 L64 42 L38 29 Z" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" />
  </g>
</svg>
