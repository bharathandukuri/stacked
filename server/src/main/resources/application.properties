# ==============================================================================
# Stacked Server Application Properties
# ==============================================================================
spring.application.name=stacked
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# MongoDB Configuration
# ------------------------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://${MONGO_INITDB_ROOT_USERNAME:stacked_admin}:${MONGO_INITDB_ROOT_PASSWORD:stacked_secret}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGO_INITDB_DATABASE:stacked_db}?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# ------------------------------------------------------------------------------
# Redis Configuration (Lettuce Driver)
# ------------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:stacked_redis_secret}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

# Lettuce Connection Pooling
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bharath.stacked=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ------------------------------------------------------------------------------
# JWT Configuration
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# ------------------------------------------------------------------------------
# Secure Cookie Configuration
# ------------------------------------------------------------------------------
cookie.http-only=${COOKIE_HTTP_ONLY:true}
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:lax}
cookie.domain=${COOKIE_DOMAIN:}
cookie.path=${COOKIE_PATH:/}

# ------------------------------------------------------------------------------
# Initial Admin Credentials (for database initialization)
# ------------------------------------------------------------------------------
admin.default.email=${ADMIN_DEFAULT_EMAIL:admin@stacked.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin@123456}
admin.default.name=${ADMIN_DEFAULT_NAME:Platform Admin}

# ------------------------------------------------------------------------------
# Application URLs & CORS Configuration
# ------------------------------------------------------------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.backend-url=${BACKEND_URL:http://localhost:8080}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ------------------------------------------------------------------------------
# File Upload & Storage Configuration
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

file.storage.temp-path=${FILE_STORAGE_TEMP_PATH:uploads/temp}
file.storage.permanent-path=${FILE_STORAGE_PERMANENT_PATH:uploads/permanent}
file.storage.max-file-size-bytes=${FILE_STORAGE_MAX_SIZE:10485760}
file.storage.cleanup-cron=${FILE_CLEANUP_CRON:0 0 * * * *}
file.storage.temp-ttl=${FILE_TEMP_TTL:PT1H}

# ------------------------------------------------------------------------------
# Online Judge & Sandboxing Configuration
# ------------------------------------------------------------------------------
# Active Driver: DOCKER or FIRECRACKER
judge.sandbox.driver=${JUDGE_SANDBOX_DRIVER:DOCKER}
judge.sandbox.default-timeout-ms=${JUDGE_DEFAULT_TIMEOUT_MS:5000}
judge.sandbox.compile-timeout-ms=${JUDGE_COMPILE_TIMEOUT_MS:10000}
judge.sandbox.max-output-size-bytes=${JUDGE_MAX_OUTPUT_SIZE_BYTES:65536}
judge.sandbox.workspace-dir=${JUDGE_WORKSPACE_DIR:/tmp/stacked/workspace}

# Docker Sandbox Driver Settings (Connects to docker-sandbox service in compose)
judge.sandbox.docker.host=${JUDGE_DOCKER_HOST:tcp://localhost:2375}
judge.sandbox.docker.cli-path=${JUDGE_DOCKER_CLI:docker}
judge.sandbox.docker.network=${JUDGE_DOCKER_NETWORK:none}
judge.sandbox.docker.read-only=${JUDGE_DOCKER_READ_ONLY:true}
judge.sandbox.docker.pids-limit=${JUDGE_DOCKER_PIDS_LIMIT:128}
judge.sandbox.docker.cpus=${JUDGE_DOCKER_CPUS:1.0}
judge.sandbox.docker.memory-limit-mb=${JUDGE_DOCKER_MEMORY_LIMIT_MB:256}

# Firecracker MicroVM Sandbox Driver Settings (Connects to firecracker-sandbox service in compose)
judge.sandbox.firecracker.service-url=${JUDGE_FIRECRACKER_SERVICE_URL:http://localhost:8085}
judge.sandbox.firecracker.binary-path=${JUDGE_FIRECRACKER_BIN:/usr/local/bin/firecracker}
judge.sandbox.firecracker.socket-dir=${JUDGE_FIRECRACKER_SOCKET_DIR:/tmp/firecracker}
judge.sandbox.firecracker.kernel-path=${JUDGE_FIRECRACKER_KERNEL:/var/lib/firecracker/kernel/vmlinux}
judge.sandbox.firecracker.rootfs-dir=${JUDGE_FIRECRACKER_ROOTFS_DIR:/var/lib/firecracker/rootfs}
judge.sandbox.firecracker.vcpu-count=${JUDGE_FIRECRACKER_VCPU_COUNT:1}
judge.sandbox.firecracker.mem-size-mib=${JUDGE_FIRECRACKER_MEM_SIZE_MIB:256}

