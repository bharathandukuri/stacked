spring:
  application:
    name: stacked

  mongodb:
    uri: ${MONGODB_URI:mongodb://${MONGO_INITDB_ROOT_USERNAME:stacked_admin}:${MONGO_INITDB_ROOT_PASSWORD:stacked_secret}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGO_INITDB_DATABASE:stacked_db}?authSource=admin}

  data:
    mongodb:
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:stacked_redis_secret}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.bharath.stacked: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

cookie:
  http-only: ${COOKIE_HTTP_ONLY:true}
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:lax}
  domain: ${COOKIE_DOMAIN:}
  path: ${COOKIE_PATH:/}

# ------------------------------------------------------------------------------
# Initial Admin Credentials (for database initialization)
# ------------------------------------------------------------------------------
admin:
  default:
    email: ${ADMIN_DEFAULT_EMAIL:admin@stacked.com}
    password: ${ADMIN_DEFAULT_PASSWORD:Admin@123456}
    name: ${ADMIN_DEFAULT_NAME:Platform Admin}

# ------------------------------------------------------------------------------
# Application URLs & CORS Configuration
# ------------------------------------------------------------------------------
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ------------------------------------------------------------------------------
# File Storage Configuration
# ------------------------------------------------------------------------------
file:
  storage:
    temp-path: uploads/temp
    permanent-path: uploads/permanent
    max-file-size-bytes: 10485760
    cleanup-cron: 0 0 * * * *
    temp-ttl: PT1H

# ------------------------------------------------------------------------------
# Execution Sandbox Configuration
# ------------------------------------------------------------------------------
stacked:
  execution:
    docker:
      enabled: ${DOCKER_ENABLED:true}
      host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    defaults:
      time-limit-ms: ${EXECUTION_DEFAULT_TIME_LIMIT_MS:2000}
      memory-limit-kb: ${EXECUTION_DEFAULT_MEMORY_LIMIT_KB:262144}
      process-limit: ${EXECUTION_DEFAULT_PROCESS_LIMIT:50}
      file-size-kb: ${EXECUTION_DEFAULT_FILE_SIZE_KB:10240}
      output-limit-bytes: ${EXECUTION_DEFAULT_OUTPUT_LIMIT_BYTES:10485760}
    languages:
      java-21:
        time-limit-ms: ${EXECUTION_JAVA_TIME_LIMIT_MS:2000}
        memory-limit-kb: ${EXECUTION_JAVA_MEMORY_LIMIT_KB:262144}
        compilation-timeout-ms: ${EXECUTION_JAVA_COMPILATION_TIMEOUT_MS:10000}
        max-heap-mb: ${EXECUTION_JAVA_MAX_HEAP_MB:192}
      cpp-23:
        time-limit-ms: ${EXECUTION_CPP_TIME_LIMIT_MS:1000}
        memory-limit-kb: ${EXECUTION_CPP_MEMORY_LIMIT_KB:131072}
        compilation-timeout-ms: ${EXECUTION_CPP_COMPILATION_TIMEOUT_MS:10000}
      c-17:
        time-limit-ms: ${EXECUTION_C_TIME_LIMIT_MS:1000}
        memory-limit-kb: ${EXECUTION_C_MEMORY_LIMIT_KB:131072}
        compilation-timeout-ms: ${EXECUTION_C_COMPILATION_TIMEOUT_MS:10000}
      python-3_12:
        time-limit-ms: ${EXECUTION_PYTHON_TIME_LIMIT_MS:3000}
        memory-limit-kb: ${EXECUTION_PYTHON_MEMORY_LIMIT_KB:262144}
      javascript-node-20:
        time-limit-ms: ${EXECUTION_NODE_TIME_LIMIT_MS:2000}
        memory-limit-kb: ${EXECUTION_NODE_MEMORY_LIMIT_KB:262144}
        max-old-space-size-mb: ${EXECUTION_NODE_MAX_OLD_SPACE_SIZE_MB:192}
      sqlite-3:
        query-timeout-ms: ${EXECUTION_SQLITE_QUERY_TIMEOUT_MS:5000}
        memory-limit-kb: ${EXECUTION_SQLITE_MEMORY_LIMIT_KB:262144}
      postgresql-16:
        query-timeout-ms: ${EXECUTION_POSTGRES_QUERY_TIMEOUT_MS:5000}
        memory-limit-kb: ${EXECUTION_POSTGRES_MEMORY_LIMIT_KB:524288}
      mysql-8_0:
        query-timeout-ms: ${EXECUTION_MYSQL_QUERY_TIMEOUT_MS:5000}
        memory-limit-kb: ${EXECUTION_MYSQL_MEMORY_LIMIT_KB:524288}
      mongodb-8_0:
        query-timeout-ms: ${EXECUTION_MONGODB_QUERY_TIMEOUT_MS:5000}
        memory-limit-kb: ${EXECUTION_MONGODB_MEMORY_LIMIT_KB:524288}
    hard-limits:
      max-time-limit-ms: ${EXECUTION_MAX_TIME_LIMIT_MS:60000}
      max-memory-limit-kb: ${EXECUTION_MAX_MEMORY_LIMIT_KB:1048576}
      max-process-limit: ${EXECUTION_MAX_PROCESS_LIMIT:100}
      max-file-size-kb: ${EXECUTION_MAX_FILE_SIZE_KB:51200}
      max-output-limit-bytes: ${EXECUTION_MAX_OUTPUT_LIMIT_BYTES:52428800}
      max-batch-size: ${EXECUTION_MAX_BATCH_SIZE:50}
      max-file-count: ${EXECUTION_MAX_FILE_COUNT:20}
      max-file-size-bytes: ${EXECUTION_MAX_FILE_SIZE_BYTES:10485760}
    docker-limits:
      container-cpu-limit: ${EXECUTION_DOCKER_CPU_LIMIT:1}
      container-memory-limit-kb: ${EXECUTION_DOCKER_MEMORY_LIMIT_KB:1048576}
      container-pids-limit: ${EXECUTION_DOCKER_PIDS_LIMIT:200}
    compilation:
      timeout-ms: ${EXECUTION_COMPILATION_TIMEOUT_MS:10000}
      memory-limit-kb: ${EXECUTION_COMPILATION_MEMORY_LIMIT_KB:524288}
    database:
      readiness-timeout-ms: ${EXECUTION_DB_READINESS_TIMEOUT_MS:30000}
      readiness-poll-interval-ms: ${EXECUTION_DB_READINESS_POLL_INTERVAL_MS:150}
      default-query-timeout-ms: ${EXECUTION_DB_QUERY_TIMEOUT_MS:5000}
    cleanup:
      stale-retention-minutes: ${EXECUTION_STALE_RETENTION_MINUTES:30}
      cron: "${EXECUTION_CLEANUP_CRON:0 */5 * * * *}"
