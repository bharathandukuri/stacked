services:
  mongodb:
    image: mongo:8.0
    container_name: stacked-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-stacked_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-stacked_secret}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-stacked_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - stacked-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: stacked-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-stacked_redis_secret}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - stacked-network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-stacked_redis_secret}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stacked-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-stacked_admin}:${MONGO_INITDB_ROOT_PASSWORD:-stacked_secret}@mongodb:27017/${MONGO_INITDB_DATABASE:-stacked_db}?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stacked_redis_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - server_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stacked-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stacked-client
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - server
    networks:
      - stacked-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  server_uploads:
    driver: local

networks:
  stacked-network:
    driver: bridge
