services:
  mongodb:
    image: mongo:8.0
    container_name: stacked-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-stacked_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-stacked_secret}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-stacked_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: stacked-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-stacked_redis_secret}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-stacked_redis_secret}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Dedicated Docker-in-Docker (DinD) execution daemon
  dind:
    image: docker:27-dind
    container_name: stacked-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - dind_data:/var/lib/docker
    networks:
      - backend-network

  # Application Backend (connected to both frontend-network and backend-network)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stacked-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-stacked_admin}:${MONGO_INITDB_ROOT_PASSWORD:-stacked_secret}@mongodb:27017/${MONGO_INITDB_DATABASE:-stacked_db}?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stacked_redis_secret}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://dind:2375}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_DEFAULT_ENABLED: ${ADMIN_DEFAULT_ENABLED:-true}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      dind:
        condition: service_started
    networks:
      - frontend-network
      - backend-network

  # Application Frontend (isolated in frontend-network, cannot reach databases or dind)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stacked-client
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - server
    networks:
      - frontend-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  server_uploads:
    driver: local
  dind_data:
    driver: local

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
