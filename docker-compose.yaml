services:
  mongodb:
    image: mongo:8.0
    container_name: stacked-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-stacked_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-stacked_secret}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-stacked_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - stacked-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: stacked-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-stacked_redis_secret}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - stacked-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-stacked_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  docker:
    image: docker:29-dind
    container_name: stacked-docker
    restart: unless-stopped
    privileged: true
    ports:
      - "${DOCKER_PORT:-2375}:2375"
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker_data:/var/lib/docker
    networks:
      - stacked-network
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  docker_data:
    driver: local

networks:
  stacked-network:
    driver: bridge
